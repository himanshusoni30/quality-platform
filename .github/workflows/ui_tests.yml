run-name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    environment: QA
    
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      BROWSER: ${{ matrix.browser }}
    steps:
      - name: Get code
        uses: actions/checkout@v6
        
      - name: Set-up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui-tests/package-lock.json

      - name: Install Playwright dependencies and Browser
        run: |
          cd ui-tests
          npm ci
          npx playwright install --with-deps "${BROWSER}"
          if [ "${BROWSER}" == "chromium" ]; then
            npx playwright install chromium-headless-shell
          fi
          npx playwright install --list

      - name: Run Tests
        env:
          CUSTOMER_EMAIL: ${{ vars.CUSTOMER_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_PASSWORD }}
        run: |
          cd ui-tests
          npx playwright test --project="${BROWSER}"

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-${{ matrix.browser }}
          path: ui-tests/playwright-report/

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results-${{ matrix.browser }}
          path: ui-tests/test-results/

