run-name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4
        
      - name: SetUp Java 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      # - name: Add caching explicitly
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.m2/repository
      #     key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
      #     restore-keys: |
      #       maven-${{ runner.os }}-

      - name: Run Tests
        run: |
          cd api-tests
          mvn -B -ntp test

      - name: Generate surefire report
        run: |
          cd api-tests
          mvn -B --no-transfer-progress surefire-report:report-only

      - name: Publish artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: lab/target/reports
