run-name: Build and Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        timeout-minutes: 15 #expected to finish execution with this time and do not hang the job
        steps:
            - name: Get the code
              uses: actions/checkout@v4

            - name: Install Java 17
              uses: actions/setup-java@v4
              with:
                java-version: 17
                distribution: temurin
                cache: maven
            
            - name: Start Up Application and Run Tests
              run: |
                cd lab
                mvn clean install
                nohup mvn spring-boot:run > spring.log 2>&1 &

            - name: Perform Health Checks
              run: |
                timeout 60s bash -c 'until curl -s http://localhost:8080/actuator/health | grep "UP"; do sleep 2; done'

            - name: Run Tests
              run: |
                ls -la
                cd lab
                ls -la
                mvn surefire-report:report