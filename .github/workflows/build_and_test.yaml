run-name: Build and Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v4

            - name: Install Java 17
              uses: actions/setup-java@v4
              with:
                java-version: 17
                distribution: temurin
                cache: maven
            
            - name: Start Up spring boot application
              run: |
                cd lab
                mvn clean install
                mvn spring-boot:run

            - name: Run tests
              run: |
                ls -la
                mvn surefire-report:report
               

